<!DOCTYPE html>
<html>
<head>
    <title>A* Pathfinding with Edge Avoidance</title>
    <style>
        canvas { border: 1px solid black; }
        #debug { margin-top: 20px; font-family: Arial, sans-serif; }
        #controls { margin-bottom: 10px; }
    </style>
</head>
<body>
    <script src="Wayfinding.js"></script>
    <div id="controls">
        <label>
            <input type="checkbox" id="avoidEdges" checked> Avoid Edges
        </label>
        <button id="regeneratePath">Regenerate Path</button>
    </div>
    <canvas id="myCanvas" width="1500" height="1200"></canvas>
    <div id="debug"></div>

    <script>

    function getRandomRectangles(numRectangles, minWidth, maxWidth, minHeight, maxHeight, canvasWidth, canvasHeight) {
        const blockedRectangles = [];
        for (let i = 0; i < numRectangles; i++) {
            const randomX = Math.floor(Math.random() * (canvasWidth - maxWidth));
            const randomY = Math.floor(Math.random() * (canvasHeight - maxHeight));
            const randomWidth = Math.floor(Math.random() * (maxWidth - minWidth)) + minWidth;
            const randomHeight = Math.floor(Math.random() * (maxHeight - minHeight)) + minHeight;
            blockedRectangles.push({ x: randomX, y: randomY, width: randomWidth, height: randomHeight });
        }
        return blockedRectangles;
    }

    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const debugDiv = document.getElementById("debug");
    const avoidEdgesCheckbox = document.getElementById("avoidEdges");
    const regeneratePathButton = document.getElementById("regeneratePath");

    function logDebug(message) {
        if (debugDiv) {
            debugDiv.innerHTML += message;
        }
        console.log(message);
    }

    canvas.width = 64*40;
    canvas.height = 64*40;

    const gridWidth = canvas.width;
    const gridHeight = canvas.height;
    const tileSize = 32;
    const characterSize = 128;
    const edgeMargin = 1; // Number of tiles to avoid at the edges
    const start = { x: 150, y: 150 };
    const end = { x: canvas.width - 150, y: canvas.height - 150 };

    const blockedRectangles = getRandomRectangles(22, 50, 100, 50, 100, gridWidth, gridHeight);

    const astar = new AStar(
		gridWidth / tileSize, 
		gridHeight / tileSize, 
		tileSize, 
		blockedRectangles, 
		characterSize, 
		edgeMargin
	);

    function drawGrid() {
        ctx.strokeStyle = "#ddd";
        for (let x = 0; x < gridWidth; x += tileSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, gridHeight);
            ctx.stroke();
        }
        for (let y = 0; y < gridHeight; y += tileSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(gridWidth, y);
            ctx.stroke();
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        // Draw edge margin if avoid edges is enabled
        if (astar.avoidEdges) {
            ctx.fillStyle = "rgba(255, 255, 0, 0.2)";
            ctx.fillRect(0, 0, gridWidth, edgeMargin * tileSize);
            ctx.fillRect(0, gridHeight - edgeMargin * tileSize, gridWidth, edgeMargin * tileSize);
            ctx.fillRect(0, 0, edgeMargin * tileSize, gridHeight);
            ctx.fillRect(gridWidth - edgeMargin * tileSize, 0, edgeMargin * tileSize, gridHeight);
        }

        // Draw blocked rectangles (colliders)
        ctx.fillStyle = "rgba(255, 0, 0, 0.5)";
        blockedRectangles.forEach(rect => {
            ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
        });

        // Draw start and end points
        ctx.fillStyle = "green";
        ctx.fillRect(start.x - characterSize/2, start.y - characterSize/2, characterSize, characterSize);
        ctx.fillStyle = "blue";
        ctx.fillRect(end.x - characterSize/2, end.y - characterSize/2, characterSize, characterSize);

        // Visualize walkable and non-walkable areas
        for (let x = 0; x < gridWidth; x += tileSize) {
            for (let y = 0; y < gridHeight; y += tileSize) {
                if (!astar.isWalkable(Math.floor(x/tileSize), Math.floor(y/tileSize))) {
                    ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
                    ctx.fillRect(x, y, tileSize, tileSize);
                }
            }
        }
    }

    function findAndDrawPath() {
        drawScene();
        debugDiv.innerHTML = ""; // Clear previous debug messages

        const path = astar.findPath(start, end);

        if (path && path.length > 0) {
            logDebug("<p>Path found!</p>");

            // Draw the path
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.strokeStyle = "purple";
            ctx.lineWidth = 3;
            ctx.stroke();
        } else {
            logDebug("<p>No path found. Possible reasons:</p>");
            logDebug("<ul>");
            logDebug("<li>Start or end point might be in a non-walkable area</li>");
            logDebug("<li>There might be no valid path between start and end</li>");
            logDebug("<li>The character size might be too large for the available spaces</li>");
            logDebug("</ul>");
            
            if (!astar.isWalkable(Math.floor(start.x/tileSize), Math.floor(start.y/tileSize))) {
                logDebug("<p>Start point is in a non-walkable area!</p>");
            }
            if (!astar.isWalkable(Math.floor(end.x/tileSize), Math.floor(end.y/tileSize))) {
                logDebug("<p>End point is in a non-walkable area!</p>");
            }
        }
    }

    avoidEdgesCheckbox.addEventListener('change', (event) => {
        astar.setAvoidEdges(event.target.checked);
        findAndDrawPath();
    });

    regeneratePathButton.addEventListener('click', findAndDrawPath);

    findAndDrawPath();
    </script>
</body>
</html>
