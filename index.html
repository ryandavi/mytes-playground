				<span class="text"><u>D</u>rag</span>

			<input type="radio" name="hand" value="right" id="hand-pet">
			<label class="button" for="hand-pet">
				<svg id="hand_pet_icon" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10.5 12">
					<path id="Paw"

			<!-- LOADING SCREEN -->

							<div class="icon">📂</div>

						</div>
						<div class="modal-controls">
							<button class="modal-close-btn">&times;</button>
						</div>
					</div>

					<div class="modal-content">
						<div class="loading-message">
							<p>Please wait while your Mytes are being prepared.</p>
						</div>
						<div class="loading-icon"></div>
						<div class="loading-progress-container">
							<div class="loading-progress">
								<div class="loading-progress-blocks"></div>
							</div>
						</div>

					</div>

					<div class="modal-footer">
						<div class="button" id="loading-skip-button">Skip Loading</div>
					</div>
					-->

				</div>
			</div>
			<!-- END LOADING SCREEN -->

			<!-- CANVAS -->
			<div class="canvas">
				<!-- map objects -->
				<div class="layer debug"></div>
				<div class="layer background"></div>
				<div class="layer particles"></div>
				<!-- map objects -->
				<div class="layer controls">
					<div class="ignore dot cursor-dot debug"></div>
				</div>
				<div class="layer foreground">
					<!-- MYTE CONTAINER -->
					<div class="myteContainer">
						<div id="myteWrapper-1" class="myteWrapper snail">

							<div class="home-name">

							<div class="home-wrapper"></div>

							<!-- MYTE START-->
							<div id="myte-pookie" class="interactive-myte" data-myte-name="Lentil" draggable="false">
								<div class="inner-wrapper">
									<div class="sprite"></div>
									<div class="selectbox"></div>
									<div class="name-wrapper">
										<span class="before">x</span>
										<div class="name tooltip">Lentil</div>
									</div>
									<div class="commands"></div>
									<div class="dialogue">
										<span class="text">Hiii</span>
									</div>
									<div class="above-wrapper">
										<div class="battery"></div>

							</div>
							<!-- MYTE END-->

		<!-- ACTION CONTROLS MENU -->
		<div class="sidebar right">
			<div class="action-controls ignore" id="action-controls">
				<div class="selected-info">
					<div class="interaction-type">
						<span class="type">Not Selected</span>
					</div>
					<div class="target-info">
						<span class="type">-</span>
						<span class="name">None</span>
					</div>
				</div>
				<div class="action-groups">
				</div>
			</div>
		</div>
		<!-- END ACTION CONTROLS MENU -->
		<div class="bottom">
			<div class="left">
				<!-- ALL MYTES -->
				<div class="allMytes inset" id="all_mytes"></div>
				<!-- END MYTES -->
				<!-- INVENTORY -->
				<div class="inventory inset" id="inventory"></div>
				<!-- END INVENTORY -->
			</div>
			<!-- CONTROLS -->
			<div class="controls right" id="controls">
				<button id="cycleGoal" class="myte" disabled>Loading...</button>
				<button id="cycleFollowGoal" class="myte" disabled>Loading...</button>
				<button id="skipQueue" class="myte" disabled>Skip Queue</button>
				<button id="toggleDebug">Toggle Debug</button>
				<button id="cycleCamera">Loading...</button>
				<button id="cycleContainerLimit" class="myte" disabled>Loading...</button>

	<!-- SOUND SETTINGS -->
	<div id="sound-settings-panel" class="modal-window">
		<div class="modal-header">
			<h2 class="modal-title">
				<span class="icon">🔊</span>
				<span class="text">Sounds Settings</span>
			</h2>
			<div class="modal-controls">
				<button class="modal-minimize-btn">&#128469;</button>
				<button class="modal-fullscreen-btn">&#x26F6;</button>
				<button class="modal-close-btn">&times;</button>
			</div>
		</div>
		<div class="modal-content">
			<div class="settings-group">
				<div class="setting-item">
					<label for="master-volume">Master Volume</label>
					<input type="range" id="master-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="ui-volume">UI Volume</label>
					<input type="range" id="ui-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="ambient-volume">Ambient Volume</label>
					<input type="range" id="ambient-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="sfx-volume">SFX Volume</label>
					<input type="range" id="sfx-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="music-volume">Music Volume</label>
					<input type="range" id="music-volume" min="0" max="100" value="0">
				</div>
			</div>
			<div class="settings-group">
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="sound-enabled" checked>
						<label for="sound-enabled">Sound Effects</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="music-enabled" checked>
						<label for="music-enabled">Background Music</label>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- END SOUND SETTINGS -->
	<!-- GAME SETTINGS PANEL -->
	<div id="game-settings-panel" class="modal-window">
		<div class="modal-header">
			<h2 class="modal-title">
				<span class="icon">⚙️</span>
				<span class="text">Game Settings</span>
			</h2>
			<div class="modal-controls">
				<button class="modal-minimize-btn">&#128469;</button>
				<button class="modal-fullscreen-btn">&#x26F6;</button>
				<button class="modal-close-btn">&times;</button>
			</div>
		</div>
		<div class="modal-content">
			<!-- Graphics Settings -->
			<div class="settings-group">
				<h3 class="settings-group-title">Graphics</h3>
				<div class="setting-item dropdown">
					<label for="graphics-quality">Quality</label>
					<select id="graphics-quality">
						<option value="low">Low</option>
						<option value="medium" selected>Medium</option>
						<option value="high">High</option>
						<option value="ultra">Ultra</option>
					</select>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="effects-toggle" checked>
						<label for="effects-toggle">Special Effects</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="animations-toggle" checked>
						<label for="animations-toggle">Animations</label>
					</div>
				</div>
			</div>
			<!-- Gameplay Settings -->
			<div class="settings-group">
				<h3 class="settings-group-title">Gameplay</h3>
				<div class="setting-item dropdown">
					<label for="difficulty-select">Difficulty</label>
					<select id="difficulty-select">
						<option value="easy">Easy</option>
						<option value="normal" selected>Normal</option>
						<option value="hard">Hard</option>
						<option value="nightmare">Nightmare</option>
					</select>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="tutorials-toggle" checked>
						<label for="tutorials-toggle">Show Tutorials</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="autosave-toggle" checked>
						<label for="autosave-toggle">Auto-Save</label>
					</div>
				</div>
			</div>
			<!-- Miscellaneous Settings -->
			<div class="settings-group">
				<h3 class="settings-group-title">Miscellaneous</h3>
				<div class="setting-item dropdown">
					<label for="language-select">Language</label>
					<select id="language-select">
						<option value="en" selected>English</option>
						<option value="es">Spanish</option>
						<option value="fr">French</option>
						<option value="de">German</option>
						<option value="ja">Japanese</option>
					</select>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="notifications-toggle" checked>
						<label for="notifications-toggle">Notifications</label>
					</div>
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button id="restore-defaults" class="secondary">Restore Defaults</button>
			<button id="save-settings" class="primary">Save</button>
		</div>
	</div>
