<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="test"></div>
	<div id="customCursor"></div>

	<section class="debug-panel debugMenu ignore"></section>
	<section class="action-queue-panel ignore"></section>
	<!-- MAIN SCREEN -->
	<div class="app-shell styled">
		<!-- HEADER-->
		<div class="ignore header">
			<div class="logo"><img src="images/logo.svg"></div>
			<div class="active-pet" id="hud-active-pet">
				<div class="name">Name</div>
				<div class="mood">Mood</div>
				<div class="energy">Energy</div>
			</div>
			<div class="date-time">
				<div class="username">--:--</div>
			</div>
			<div class="user">
				<div class="username">Guest</div>
			</div>
			<button class="app-fullscreen-btn fullscreen-btn">⛶</button>
		</div>
		<!-- END HEADER -->
		<!-- HAND CONTROLS -->
		<div class="hand-controls ignore" id="hand-controls">
			<!-- RADIO BUTTONS -->
			<input type="radio" name="hand" value="left" id="hand-select" checked>
			<label class="button" for="hand-select">
				<svg id="hand_pointer_icon" class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10.5 12">

			<label class="button" class="button" for="hand-drag">

				<span class="text"><u>D</u>rag</span>

			<input type="radio" name="hand" value="right" id="hand-pet">
			<label class="button" for="hand-pet">

				</svg>
				<span class="text"><u>P</u>et</span>
			</label>
			<!-- RADIO BUTTONS-->
			<button id="settings-toggle" class="hand-control-btn" title="Settings">
				<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">

						d="m10.21,10.1c-.07,0-.13-.02-.19-.05l-1.09-.63c-.42.35-.9.63-1.42.82v1.26c0,.18-.12.33-.29.37-.39.08-.79.13-1.21.13s-.82-.05-1.21-.13c-.17-.04-.29-.19-.29-.37v-1.26c-.53-.19-1.01-.46-1.42-.82l-1.1.63c-.06.04-.13.05-.19.05-.51,0-1.5-1.99-1.5-2.32,0-.13.07-.26.19-.33l1.09-.63c-.05-.27-.08-.54-.08-.82s.03-.55.08-.82l-1.09-.63c-.12-.07-.19-.2-.19-.33,0-.4,1.03-2.32,1.5-2.32.07,0,.13.02.19.05l1.1.63c.42-.35.9-.63,1.42-.82V.5c0-.18.12-.33.29-.37.39-.08.79-.13,1.21-.13s.82.05,1.21.13c.17.04.29.19.29.37v1.26c.53.19,1.01.46,1.42.82l1.09-.63c.06-.04.13-.05.19-.05.51,0,1.5,1.99,1.5,2.32,0,.13-.07.26-.19.33l-1.09.63c.05.27.08.54.08.82s-.03.55-.08.82l1.09.63c.12.07.19.2.19.33,0,.4-1.03,2.32-1.5,2.32Zm-2.33-4.1c0-1.03-.84-1.88-1.88-1.88s-1.88.84-1.88,1.88.84,1.88,1.88,1.88,1.88-.84,1.88-1.88Z" />
			</svg>



			</button>
			<!-- BUTTONS -->
			<button id="sound-toggle" class="hand-control-btn" title="Toggle Sound">

				<svg class="icon icon-sound-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
					<path id="Sound_On"

					<path id="Sound_Off"
						d="m11.91,10.63c-.15.19-.43.23-.63.08L.17,2c-.2-.15-.23-.44-.08-.63.09-.11.22-.17.35-.17.1,0,.19.03.28.1l3.3,2.59,2.17-1.93c.18-.16.43-.2.64-.1.22.1.35.31.35.55v3.97l1.02.8c-.05-.17,0-.36.15-.48.21-.17.33-.43.33-.69s-.12-.52-.33-.69c-.19-.16-.22-.44-.06-.63.16-.19.44-.22.63-.06.42.35.66.85.66,1.39s-.24,1.04-.66,1.39c-.08.07-.18.1-.28.1,0,0-.02,0-.03,0l.83.65s.03-.04.05-.06c.64-.52,1-1.28,1-2.08s-.36-1.56-1-2.08c-.19-.16-.22-.44-.06-.63.16-.19.44-.22.63-.06.84.69,1.33,1.7,1.33,2.78s-.45,2-1.24,2.69l1.67,1.3c.2.15.23.44.08.63ZM1.66,4.32l5.54,4.34v.94c0,.24-.14.45-.35.55-.08.04-.16.05-.25.05-.14,0-.29-.05-.4-.15l-2.53-2.25h-1.57c-.5,0-.9-.4-.9-.9v-1.8c0-.34.19-.63.46-.78Z" />
				</svg>

				

			</button>

		<!-- BUTTONS -->
		<button id="view-toggle" class="hand-control-btn" title="View Controls">
			<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
				<path d="M6,2C3.24,2,0.9,3.68,0,6c0.9,2.32,3.24,4,6,4s5.1-1.68,6-4C11.1,3.68,8.76,2,6,2z M6,8.5C4.62,8.5,3.5,7.38,3.5,6 S4.62,3.5,6,3.5S8.5,4.62,8.5,6S7.38,8.5,6,8.5z M6,5C5.45,5,5,5.45,5,6s0.45,1,1,1s1-0.45,1-1S6.55,5,6,5z"/>
			</svg>
		</button>
		<!-- BUTTONS -->
		<button id="debug-toggle" class="hand-control-btn" title="Toggle Debug">

			<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
				<path
			d="m12,6.75c0,.41-.34.75-.75.75h-1.5v.75c0,.35-.07.69-.19,1l1.47,1.46c.29.29.29.77,0,1.06-.15.15-.34.22-.53.22s-.38-.07-.53-.22l-1.27-1.27c-.53.45-1.2.74-1.95.74h-.38v-5.63c0-.21-.17-.37-.37-.37s-.37.17-.37.37v5.63h-.38c-.75,0-1.43-.28-1.95-.74l-1.27,1.27c-.15.15-.34.22-.53.22s-.38-.07-.53-.22c-.29-.29-.29-.77,0-1.06l1.47-1.46c-.11-.32-.19-.65-.19-1v-.75H.75C.34,7.5,0,7.16,0,6.75s.34-.75.75-.75h1.5v-1.19l-1.28-1.28c-.29-.29-.29-.77,0-1.06s.77-.29,1.06,0l1.28,1.28h5.38l1.28-1.28c.29-.29.77-.29,1.06,0s.29.77,0,1.06l-1.28,1.28v1.19h1.5c.41,0,.75.34.75.75Zm-3.75-3.75H3.75v-.75c0-1.24,1.01-2.25,2.25-2.25s2.25,1.01,2.25,2.25v.75Z" />
			</svg>

			
		</button>


			<!-- END BUTTONS -->
		</div>
		<!-- END HAND CONTROLS -->
		<!-- CANVAS CONTAINER -->
		<section class="app-stage container" id="container-1">
			<!-- CROSSHAIR -->
			<div class="container-inset ignore debug"></div>
			<div class="myte-overlay-row ignore">
				<section class="myte-queue-overlay ignore" id="myte_queue_overlay"></section>
				<section class="myte-buff-overlay ignore" id="myte_buff_overlay"></section>
			</div>
			<div class="crosshair ignore debug">
				<div class="horizontal"></div>
				<div class="vertical"></div>
			</div>
			<!-- END CROSSHAIR -->
			<!-- LOADING SCREEN -->
			<div class="loading-screen" id="loading-screen">
				<div id="loading-modal" class="window-panel">
					<div class="window-panel__header">
						<div class="window-panel__title">
							<div class="icon">📂</div>
							<div class="text">Loading Mytes...</div>
						</div>
						<div class="window-panel__controls">
							<button class="modal-close-btn">&times;</button>
						</div>
					</div>
					<div class="window-panel__content">
						<div class="loading-message">
							<p>Please wait while your Mytes are being prepared.</p>
						</div>
						<div class="loading-icon"></div>
						<div class="loading-progress-container">
							<div class="loading-progress">
								<div class="loading-progress-blocks"></div>
							</div>
						</div>
						<div class="loading-status">Loading essential files...</div>
						<div class="loading-tip"></div>
					</div>
					<!--
					<div class="window-panel__footer">
						<div class="button" id="loading-skip-button">Skip Loading</div>
					</div>
					-->
				</div>
			</div>
			<!-- END LOADING SCREEN -->
			<!-- CANVAS -->
			<div class="canvas">
				<!-- map objects -->
				<div class="layer debug"></div>
				<div class="layer background"></div>
				<div class="layer ground-decor"></div>
				<div class="layer environment-back"></div>
				<div class="layer particles"></div>
				<!-- map objects -->
				<div class="layer controls">
					<div class="ignore dot cursor-dot debug"></div>
				</div>
				<div class="layer foreground">
					<!-- MYTE CONTAINER — slots are generated by ContainerManager.setupMytes() -->
					<!-- END MYTE CONTAINER -->
					<!-- Myte 2 -->
					<!--
							<div class="myteContainer">
								<div id="myteWrapper-2" class="myteWrapper worm" data-myte-species="worm">

										<div class="name tooltip">Pookie's Home</div>
									</div>
									<div class="home-wrapper"></div>

						-->
				</div>
				<div class="layer environment-front"></div>
				<div class="layer effects"></div>
			</div>
			<!-- END CANVAS -->
		</section>
		<!-- END CANVAS CONTAINER -->
		<!-- ACTION CONTROLS MENU -->
		<div class="sidebar right">
			<div class="action-controls ignore" id="action-controls">
				<div class="selected-info">
					<div class="interaction-type">
						<span class="type">Not Selected</span>
					</div>
					<div class="target-info">
						<span class="type">-</span>
						<span class="name">None</span>
					</div>
				</div>
				<div class="other-info">
					<span class="position"></span>
					<span class="state"></span>
				</div>
				<div class="action-groups">
				</div>
			</div>
		</div>
		<!-- END ACTION CONTROLS MENU -->
		<div class="bottom">
			<!-- ALL MYTES -->
			<div class="myte-roster" id="all_mytes"></div>
			<!-- END MYTES -->
			<!-- INVENTORY -->
			<div class="inventory inventory-grid" id="inventory"></div>
			<!-- END INVENTORY -->
		</div>
	</div>
	<!-- SOUND SETTINGS -->
	<div id="sound-settings-panel" class="window-panel">
		<div class="window-panel__header">
			<h2 class="window-panel__title">
				<span class="icon">🔊</span>
				<span class="text">Sounds Settings</span>
			</h2>
			<div class="window-panel__controls">
				<button class="modal-minimize-btn">&#128469;</button>
				<button class="modal-fullscreen-btn">&#x26F6;</button>
				<button class="modal-close-btn">&times;</button>
			</div>
		</div>
		<div class="window-panel__content">
			<div class="settings-group">
				<div class="setting-item">
					<label for="master-volume">Master Volume</label>
					<input type="range" id="master-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="ui-volume">UI Volume</label>
					<input type="range" id="ui-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="ambient-volume">Ambient Volume</label>
					<input type="range" id="ambient-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="sfx-volume">SFX Volume</label>
					<input type="range" id="sfx-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="footsteps-volume">Footsteps Volume</label>
					<input type="range" id="footsteps-volume" min="0" max="100" value="0">
				</div>
				<div class="setting-item">
					<label for="music-volume">Music Volume</label>
					<input type="range" id="music-volume" min="0" max="100" value="0">
				</div>
			</div>
			<div class="settings-group">
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="sound-enabled" checked>
						<label for="sound-enabled">Sound Effects</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="music-enabled" checked>
						<label for="music-enabled">Background Music</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="footsteps-enabled" checked>
						<label for="footsteps-enabled">Footsteps</label>
					</div>
				</div>
			</div>
		</div>
		<div class="window-panel__footer">
			<button type="button" id="sound-reset-defaults" class="debug-button">Reset Audio Defaults</button>
		</div>
	</div>
	<!-- END SOUND SETTINGS -->
	<!-- GAME SETTINGS PANEL -->
	<div id="game-settings-panel" class="window-panel">
		<div class="window-panel__header">
			<h2 class="window-panel__title">
				<span class="icon">⚙️</span>
				<span class="text">Game Settings</span>
			</h2>
			<div class="window-panel__controls">
				<button class="modal-minimize-btn">&#128469;</button>
				<button class="modal-fullscreen-btn">&#x26F6;</button>
				<button class="modal-close-btn">&times;</button>
			</div>
		</div>
		<div class="window-panel__content">
			<!-- Graphics Settings -->
			<div class="settings-group">
				<h3 class="settings-group-title">Graphics</h3>
				<div class="setting-item dropdown">
					<label for="graphics-quality">Quality</label>
					<select id="graphics-quality">
						<option value="low">Low</option>
						<option value="medium" selected>Medium</option>
						<option value="high">High</option>
						<option value="ultra">Ultra</option>
					</select>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="effects-toggle" checked>
						<label for="effects-toggle">Special Effects</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="animations-toggle" checked>
						<label for="animations-toggle">Animations</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="time-of-day-overlay-toggle" checked>
						<label for="time-of-day-overlay-toggle">Show Time of Day Overlay</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="weather-toggle" checked>
						<label for="weather-toggle">Show Weather</label>
					</div>
				</div>
			</div>
			<!-- Gameplay Settings -->
			<div class="settings-group">
				<h3 class="settings-group-title">Gameplay</h3>
				<div class="setting-item dropdown">
					<label for="difficulty-select">Difficulty</label>
					<select id="difficulty-select">
						<option value="easy">Easy</option>
						<option value="normal" selected>Normal</option>
						<option value="hard">Hard</option>
						<option value="nightmare">Nightmare</option>
					</select>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="tutorials-toggle" checked>
						<label for="tutorials-toggle">Show Tutorials</label>
					</div>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="autosave-toggle" checked>
						<label for="autosave-toggle">Auto-Save</label>
					</div>
				</div>
			</div>
			<!-- Miscellaneous Settings -->
			<div class="settings-group">
				<h3 class="settings-group-title">Miscellaneous</h3>
				<div class="setting-item dropdown">
					<label for="language-select">Language</label>
					<select id="language-select">
						<option value="en" selected>English</option>
						<option value="es">Spanish</option>
						<option value="fr">French</option>
						<option value="de">German</option>
						<option value="ja">Japanese</option>
					</select>
				</div>
				<div class="setting-item">
					<div class="checkbox-wrapper">
						<input type="checkbox" id="notifications-toggle" checked>
						<label for="notifications-toggle">Notifications</label>
					</div>
				</div>
			</div>
		</div>
		<div class="window-panel__footer">
			<button id="restore-defaults" class="secondary">Restore Defaults</button>
			<button id="save-settings" class="primary">Save</button>
		</div>
	</div>
	<!-- END GAME SETTINGS PANEL -->

	<!-- VIEW PANEL -->
	<div id="view-panel" class="window-panel">
		<div class="window-panel__header">
			<h2 class="window-panel__title">
				<span class="icon">🔍</span>
				<span class="text">View</span>
			</h2>
			<div class="window-panel__controls">
				<button class="modal-minimize-btn">&#128469;</button>

			<div class="settings-group">
				<h3 class="settings-group-title">Zoom</h3>
				<button id="view-zoom-out" title="Zoom out">−</button>
				<span id="view-zoom-label" class="view-zoom-label">100%</span>
				<button id="view-zoom-in" title="Zoom in">+</button>
				<button id="view-zoom-reset" title="Reset to 1×">1×</button>
				<button id="view-jump-myte" title="Center on active Myte">Center Myte</button>
				<button id="view-jump-fit" title="Fit entire map in view">Fit Map</button>
				<button id="view-reset-camera" title="Reset camera to default position">Reset Camera</button>
			</div>
			<div class="settings-group">
				<h3 class="settings-group-title">Camera Follow</h3>
				<button class="follow-mode-btn" data-mode="0" title="Follow active Myte">Myte</button>
				<button class="follow-mode-btn" data-mode="1" title="Camera follows cursor">Cursor</button>
				<button class="follow-mode-btn" data-mode="2" title="Camera pans at screen edges">Edge</button>
				<button class="follow-mode-btn" data-mode="3" title="Drag to pan manually">Pan</button>
				<button class="follow-mode-btn" data-mode="4" title="Camera does not move">Locked</button>
				<button class="follow-mode-btn" data-mode="5" title="Zoom out to show all Mytes">Overview</button>
				<button class="follow-mode-btn" data-mode="6" title="Follow active Myte only when it nears the edge">Leash</button>
				<button class="follow-mode-btn" data-mode="7" title="Slowly pan across the map">Cinematic</button>
			</div>
			<div class="settings-group">
				<h3 class="settings-group-title">Camera Options</h3>
				<label class="settings-toggle" title="Shake the camera on impact events">
					<input type="checkbox" id="view-shake-toggle" checked>
					Camera Shake
				</label>
				<label class="settings-toggle" title="Camera coasts to a stop after dragging">
					<input type="checkbox" id="view-inertia-toggle" checked>
					Pan Inertia
				</label>
			</div>
		</div>
	</div>
