	<div class="container-wrapper styled">

		<div class="ignore header">
			<div class="logo"><img src="../images/logo.svg"></div>
			<div class="active-pet" id="hud-active-pet">
				<div class="name">Name</div>
				<div class="mood">Mood</div>
				<div class="energy">Energy</div>
			</div>

			</div>

		<div class="hand-controls ignore" id="hand-controls">
			<input type="radio" name="hand" value="left" id="hand-select" checked>
			<label class="button" for="hand-select">Select</label>
			<input type="radio" name="hand" value="left" id="hand-drag">
			<label for="hand-drag">Drag</label>

		</div>

		<!-- CANVAS -->
		<section class="container" id="container-1">
			<div class="crosshair ignore debug">
				<div class="horizontal"></div>
				<div class="vertical"></div>
			</div>
			<div class="canvas">
				<!-- map objects -->

				<div class="layer background"></div>
				<!-- map objects -->
				<div class="layer controls">
					<div class="ignore dot cursor-dot debug"></div>
				</div>
				<!-- mytes only go here-->
				<div class="layer foreground">
					<div class="myteContainer">
						<div id="myteWrapper-1" class="myteWrapper snail">
							<div class="home-name">
								<div class="name tooltip">Lentil's Home</div>
							</div>

							<div class="home-wrapper"></div>

							<!-- MYTE START-->
							<div id="myte-pookie" class="interactive-myte" data-myte-name="Lentil" draggable="false">
								<div class="inner-wrapper">
									<div class="sprite"></div>
									<div class="selectbox"></div>
									<div class="collidebox"></div>
									<div class="hitbox"></div>

									<div class="name-wrapper">
										<span class="before">x</span>
										<div class="name tooltip">Lentil</div>
									</div>

									<div class="commands"></div>

									<div class="dialogue">
										<span class="text">Hiii</span>
									</div>

									<div class="above-wrapper">
										<div class="battery"></div>
									</div>
								</div>
							</div>
							<!-- MYTE END-->

						</div>
					</div>
					<div class="myteContainer">
						<div id="myteWrapper-2" class="myteWrapper snail">
							<div class="home-name">
								<div class="name tooltip">Pookie's Home</div>
							</div>
							<div class="home-wrapper"></div>

							<!-- MYTE START-->
							<div id="myte-pookie2" class="interactive-myte" data-myte-name="Pookie" draggable="false">
								<div class="inner-wrapper">
									<div class="sprite"></div>
									<div class="selectbox"></div>
									<div class="collidebox"></div>
									<div class="hitbox"></div>
									<div class="name-wrapper">
										<span class="before">x</span>
										<div class="name tooltip">Pookie</div>
									</div>

									<div class="commands"></div>

									<div class="dialogue">
										<span class="text">Hiii</span>
									</div>

									<div class="above-wrapper">
										<div class="battery"></div>
									</div>
								</div>
							</div>
							<!-- MYTE END-->

						</div>

		<!-- ACTION CONTROLS-->
		<div class="sidebar right">
			<div class="action-controls ignore" id="action-controls">
				<div class="selected-info">
					<div class="interaction-type">
						<span class="type">Not Selected</span>

			<button id="skipQueue" class="myte" disabled>Skip Queue</button>

	<form>
		<!-- Text Input -->
		<label for="name">Name:</label>
		<input type="text" id="name" name="name" required><br><br>
		<!-- Email Input -->
		<label for="email">Email:</label>
		<input type="email" id="email" name="email" required><br><br>
		<!-- Password Input -->
		<label for="password">Password:</label>
		<input type="password" id="password" name="password" required><br><br>
		<!-- Radio Buttons -->
		<label>Gender:</label>
		<input type="radio" id="male" name="gender" value="male">
		<label for="male">Male</label>
		<input type="radio" id="female" name="gender" value="female">
		<label for="female">Female</label><br><br>
		<!-- Checkbox -->
		<label for="subscribe">Subscribe to Newsletter:</label>
		<input type="checkbox" id="subscribe" name="subscribe"><br><br>
		<!-- Select Dropdown -->
		<label for="country">Country:</label>
		<select id="country" name="country">
			<option value="usa">USA</option>
			<option value="canada">Canada</option>
			<option value="uk">UK</option>
		</select><br><br>
		<!-- Textarea -->
		<label for="message">Message:</label><br>
		<textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
		<!-- File Input -->
		<label for="file">Upload File:</label>
		<input type="file" id="file" name="file"><br><br>
		<!-- Submit Button -->
		<input type="submit" value="Submit">
	</form>
