	<section class="debugMenu ignore">At Rest</section>
	<section class="queueMenu ignore"></section>
	<div class="container-wrapper styled">

		<!-- HAND CONTROLS -->
		<div class="hand-controls" id="hand-controls">
			<input type="radio" name="hand" value="left" id="hand-select" checked>
			<label class="button" for="hand-select">Select</label>
			<input type="radio" name="hand" value="left" id="hand-drag">
			<label for="hand-drag">Drag</label>
			<input type="radio" name="hand" value="right" id="hand-pet">
			<label for="hand-pet">Pet</label>
		</div>
		<!-- END HAND CONTROLS -->

		<!-- CANVAS -->
		<section class="container" id="container-1">
			<div class="crosshair ignore debug">
				<div class="horizontal"></div>
				<div class="vertical"></div>
			</div>
			<div class="canvas">
				<!-- map objects -->
				<div class="layer background"></div>
				<!-- map objects -->
				<div class="layer controls">
					<div class="ignore dot cursor-dot debug"></div>
				</div>
				<!-- mytes only go here-->
				<div class="layer foreground">
					<div class="myteContainer">
						<div id="myteWrapper-1" class="myteWrapper snail">
							<div class="home-name">
								<div class="name tooltip">Lentil's Home</div>
							</div>
							<div class="home-wrapper">
							</div>
							<div id="myte-pookie" class="interactive-myte" data-myte-name="Lentil" draggable="false">
								<div class="inner-wrapper">
									<div class="sprite"></div>
									<div class="selectbox"></div>
									<div class="collidebox"></div>
									<div class="hitbox"></div>
									<div class="name-wrapper">
										<span class="before">x</span>
										<div class="name tooltip">Lentil</div>
									</div>
									<div class="above-wrapper">
										<div class="battery"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="myteContainer">
						<div id="myteWrapper-2" class="myteWrapper snail">
							<div class="home-name">
								<div class="name tooltip">Pookie's Home</div>
							</div>
							<div class="home-wrapper"></div>
							<div id="myte-pookie2" class="interactive-myte" data-myte-name="Pookie" draggable="false">
								<div class="inner-wrapper">
									<div class="sprite"></div>
									<div class="selectbox"></div>
									<div class="collidebox"></div>
									<div class="hitbox"></div>
									<div class="name-wrapper">
										<span class="before">x</span>
										<div class="name tooltip">Pookie</div>
									</div>
									<div class="above-wrapper"> Hello </div>
								</div>
							</div>
						</div>
					</div>
					<input class="collider">
					<h2> hi </h2> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <br><br>
					<div id="item_1" class="item-old food" draggable="true"></div>
					<div id="item_2" class="item-old food" draggable="true"></div>
					<div id="item_3" class="item-old food" draggable="true"></div>
					<div id="item_4" class="item-old food" draggable="true"></div>
					<div id="item_5" class="item-old food" draggable="true"></div>
					<div id="item_6" class="item-old food" draggable="true"></div>
					<div id="item_7" class="item-old food" draggable="true"></div>
					<div id="item_8" class="item-old food" draggable="true"></div>
					<div id="item_9" class="item-old food" draggable="true"></div>
					&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
					&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <textarea class="collider">hi</textarea>

					<textarea class="collider">DOWNNN</textarea>
				</div>
			</div>
		</section>

		<div class="action-controls" id="action-controls">
			<div class="selected">Selected Myte: <span>Pookie</span></div>
			<ul>
				<li><button>Test</button>
			</ul>
		</div>

		<div class="inventory" id="inventory">
		</div>
		<div class="controls" id="controls">
			<button id="cycleGoal" class="myte" disabled>Loading...</button>
			<button id="cycleFollowGoal" class="myte" disabled>Loading...</button>
			<button id="skipQueue" class="myte" disabled>Skip Queue</button>
			<button id="toggleDebug">Toggle Debug</button>
			<button id="cycleCamera">Loading...</button>
			<button id="cycleContainerLimit" class="myte" disabled>Loading...</button>
		</div>
	</div>
	</div>
	<br><br><br><br><br><br> <br><br><br>
	<img style="margin: 0 auto; max-width:500px; height: auto; display: block;" id="poo"

	<form>
		<!-- Text Input -->
		<label for="name">Name:</label>
		<input type="text" id="name" name="name" required><br><br>
		<!-- Email Input -->
		<label for="email">Email:</label>
		<input type="email" id="email" name="email" required><br><br>
		<!-- Password Input -->
		<label for="password">Password:</label>
		<input type="password" id="password" name="password" required><br><br>
		<!-- Radio Buttons -->
		<label>Gender:</label>
		<input type="radio" id="male" name="gender" value="male">
		<label for="male">Male</label>
		<input type="radio" id="female" name="gender" value="female">
		<label for="female">Female</label><br><br>
		<!-- Checkbox -->
		<label for="subscribe">Subscribe to Newsletter:</label>
		<input type="checkbox" id="subscribe" name="subscribe"><br><br>
		<!-- Select Dropdown -->
		<label for="country">Country:</label>
		<select id="country" name="country">
			<option value="usa">USA</option>
			<option value="canada">Canada</option>
			<option value="uk">UK</option>
		</select><br><br>
		<!-- Textarea -->
		<label for="message">Message:</label><br>
		<textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
		<!-- File Input -->
		<label for="file">Upload File:</label>
		<input type="file" id="file" name="file"><br><br>
		<!-- Submit Button -->
		<input type="submit" value="Submit">
	</form>
