
<div id="image-container">
	<div class="sprite" style="width:192px; height:192px;"></div>
</div>
<label>Blue:</label>
<input type="color" id="blue-color-picker" value="#0000ff">
<label>Yellow:</label>
<input type="color" id="yellow-color-picker" value="#ffff00">

<script>
	class ImageColorAdjuster {
		constructor(imageSrc, element) {
			this.image = new Image();
			this.image.src = imageSrc;
			this.spriteElement = element.querySelector('.sprite');
			this.targetColors = [
				{ hueMin: 100, hueMax: 240, label: 'blue' },   // Default: Blue tones
				{ hueMin: 10, hueMax: 90, label: 'yellow' }    // Default: Yellow tones
			];

			this.image.onload = () => {
				this.setCanvas();
			};
		}

		setCanvas(){
			this.canvas = document.createElement('canvas');
				this.ctx = this.canvas.getContext('2d');
				this.canvas.width = this.image.width;
				this.canvas.height = this.image.height;
				this.ctx.drawImage(this.image, 0, 0);
				this.imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
		}

		adjustColor(colorHex, targetColorLabel) {
			const targetColor = this.targetColors.find(color => color.label === targetColorLabel);
			if (!targetColor) return;

			const { hueMin, hueMax } = targetColor;
			const data = this.imageData.data;
			const [newR, newG, newB] = this.hexToRgb(colorHex);
			const [newHue, newSaturation, newValue] = this.rgbToHsv(newR, newG, newB);

			for (let i = 0; i < data.length; i += 4) {
				const [h, s, v] = this.rgbToHsv(data[i], data[i + 1], data[i + 2]);

				if (h >= hueMin && h <= hueMax) {
					const [r, g, b] = this.hsvToRgb(newHue, s, v); // Adjust hue, keep original saturation and value
					data[i] = r;
					data[i + 1] = g;
					data[i + 2] = b;
				}
			}

			this.ctx.putImageData(this.imageData, 0, 0);
			this.spriteElement.style.backgroundImage = `url(${this.canvas.toDataURL()})`;
		}

		// Add a new target color
		addTargetColor(hueMin, hueMax, label) {
			this.targetColors.push({ hueMin, hueMax, label });
		}

		// Remove a target color by label
		removeTargetColor(label) {
			this.targetColors = this.targetColors.filter(color => color.label !== label);
		}

		// Convert RGB to HSV
		rgbToHsv(r, g, b) {
			r /= 255;
			g /= 255;
			b /= 255;
			let max = Math.max(r, g, b), min = Math.min(r, g, b);
			let h, s, v = max;

			let d = max - min;
			s = max === 0 ? 0 : d / max;

			if (max === min) {
				h = 0; // achromatic
			} else {
				switch (max) {
					case r: h = (g - b) / d + (g < b ? 6 : 0); break;
					case g: h = (b - r) / d + 2; break;
					case b: h = (r - g) / d + 4; break;
				}
				h /= 6;
			}

			return [h * 360, s, v];
		}

		// Convert HSV to RGB
		hsvToRgb(h, s, v) {
			let r, g, b;
			let i = Math.floor(h / 60);
			let f = h / 60 - i;
			let p = v * (1 - s);
			let q = v * (1 - f * s);
			let t = v * (1 - (1 - f) * s);

			switch (i % 6) {
				case 0: r = v, g = t, b = p; break;
				case 1: r = q, g = v, b = p; break;
				case 2: r = p, g = v, b = t; break;
				case 3: r = p, g = q, b = v; break;
				case 4: r = t, g = p, b = v; break;
				case 5: r = v, g = p, b = q; break;
			}

			return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
		}

		// Convert Hex to RGB
		hexToRgb(hex) {
			let bigint = parseInt(hex.slice(1), 16);
			let r = (bigint >> 16) & 255;
			let g = (bigint >> 8) & 255;
			let b = bigint & 255;
			return [r, g, b];
		}
	}



	// Usage
	const imageAdjuster = 
	new ImageColorAdjuster(
		'../images/snail/spritesheet.png', 
		document.getElementById('image-container')
	);

	// Example: Color change based on input
	document.getElementById('blue-color-picker').addEventListener('input', (event) => {
		imageAdjuster.setCanvas();
		imageAdjuster.adjustColor(event.target.value, 'blue');
	});

	document.getElementById('yellow-color-picker').addEventListener('input', (event) => {
		imageAdjuster.setCanvas();
		imageAdjuster.adjustColor(event.target.value, 'yellow');
	});

</script>
